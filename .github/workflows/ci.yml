name: CI

on:
  push:
    branches: ['**']
  pull_request:
    # Not [main]: this repository's default branch is a claude/* branch, so
    # pinning to main meant the pull_request event never fired for any PR here.
    branches: ['**']

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # The platform monorepo (apps/*, packages/*) is not covered by the root
      # gates above — the root tsconfig excludes it and `next lint` only walks
      # the root app's directories. Without these three steps the supplier
      # boundary rule would pass CI while being unenforced, which is worse than
      # not having it: it reads as a guarantee and isn't one.
      - name: Typecheck workspaces
        run: npm run typecheck:workspaces

      - name: Lint workspaces (supplier boundary)
        run: npm run lint:workspaces

      - name: Build workspaces
        run: npm run build:workspaces

      - name: Build
        run: npm run build
        env:
          # A production build with no secrets. This is deliberate: it proves
          # the app builds without leaking a dependency on real credentials,
          # and that the config guard fails closed rather than silently
          # enabling demo behavior.
          NODE_ENV: production

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails on high/critical only, so a transitive low-severity advisory does
      # not block a payment fix from shipping. Packages whose only fix is a
      # major upgrade are accepted in audit-allowlist.json, with the reason
      # written down — everything else is a hard failure. See the header of
      # scripts/audit-check.mjs for why this is not a plain `npm audit`.
      - name: Audit
        run: node scripts/audit-check.mjs

      # Advisory only: the full report stays visible in the log even when the
      # gate above passes, so an accepted advisory cannot quietly grow.
      - name: Full audit report
        if: always()
        run: npm audit || true
