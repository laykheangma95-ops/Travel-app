<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Connect the World</title>
<style>
  :root {
    --gold: #ffcf6b;
    --teal: #37e0c6;
    --ink: #eaf2ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 50% 38%, #12294f 0%, #0b1a38 42%, #060d20 72%, #04081a 100%);
    position: relative;
  }

  /* ── WebGL canvas ─────────────────────────────────────────────── */
  #scene {
    position: fixed;
    inset: 0;
    display: block;
    touch-action: none;
    z-index: 1;
  }

  /* Soft vignette + top glow to seat the globe in space */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(70% 55% at 50% 42%, transparent 55%, rgba(3, 7, 18, 0.55) 100%),
      radial-gradient(50% 30% at 50% 8%, rgba(55, 224, 198, 0.10), transparent 70%);
  }

  /* ── Hero overlay UI ──────────────────────────────────────────── */
  .hero-ui {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: clamp(48px, 12vh, 140px) 24px 0;
    text-align: center;
    pointer-events: none;
  }
  .eyebrow {
    font-size: clamp(11px, 1.4vw, 13px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgba(234, 242, 255, 0.62);
    opacity: 0;
    animation: fadeUp 1s ease 0.2s forwards;
  }
  .headline {
    margin-top: 22px;
    font-size: clamp(38px, 8.2vw, 104px);
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.03em;
    perspective: 700px;
  }
  .headline .word { display: inline-block; white-space: nowrap; }
  .headline .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.5em) rotateX(-55deg);
    transform-origin: 50% 100%;
    animation: letterIn 0.9s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    background: linear-gradient(180deg, #ffffff 0%, #cfe6ff 48%, #7fd8ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .headline .accent {
    background: linear-gradient(180deg, #fff0c4 0%, var(--gold) 55%, var(--teal) 120%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subhead {
    margin-top: 26px;
    max-width: 560px;
    font-size: clamp(15px, 2.1vw, 19px);
    line-height: 1.6;
    color: rgba(234, 242, 255, 0.72);
    opacity: 0;
    animation: fadeUp 1.1s ease 1.5s forwards;
  }
  .cta {
    pointer-events: auto;
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 34px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #eafcff;
    text-decoration: none;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow:
      0 8px 30px rgba(2, 8, 23, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 1.1s ease 1.8s forwards;
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
  }
  .cta:hover {
    transform: translateY(-2px) scale(1.015);
    border-color: rgba(55, 224, 198, 0.6);
    background: linear-gradient(180deg, rgba(55, 224, 198, 0.22), rgba(255, 207, 107, 0.10));
    box-shadow:
      0 0 0 1px rgba(55, 224, 198, 0.35),
      0 14px 44px rgba(55, 224, 198, 0.28),
      0 6px 22px rgba(255, 207, 107, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .cta .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 12px var(--teal);
  }
  .hint {
    position: fixed;
    left: 0; right: 0; bottom: 26px;
    z-index: 3;
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(234, 242, 255, 0.4);
    opacity: 0;
    animation: fadeUp 1.2s ease 2.4s forwards;
    pointer-events: none;
  }

  /* ── Loader ───────────────────────────────────────────────────── */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-content: center;
    gap: 20px;
    justify-items: center;
    background: #060d20;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  .loader.hidden { opacity: 0; visibility: hidden; }
  .loader .ring {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-top-color: var(--teal);
    border-right-color: var(--gold);
    animation: spin 0.9s linear infinite;
  }
  .loader .lbl {
    font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase;
    color: rgba(234, 242, 255, 0.55);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes letterIn {
    to { opacity: 1; transform: translateY(0) rotateX(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .headline .letter, .subhead, .cta, .eyebrow, .hint { animation-duration: 0.01ms; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <div class="hero-ui">
    <div class="eyebrow">A World Without Distance</div>
    <h1 class="headline" id="headline" aria-label="Connect the World"></h1>
    <p class="subhead">
      Twenty thousand points of light, drawn together into one living planet —
      trace the routes that bind every city to the next.
    </p>
    <a class="cta" href="#"><span class="dot"></span> Explore the Network</a>
  </div>
  <div class="hint">Drag to rotate · Scroll to zoom · Move to attract</div>

  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="lbl">Assembling the World</div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
  import * as THREE from 'three';

  /* ════════════════════════════════════════════════════════════════
     0 · Setup
  ════════════════════════════════════════════════════════════════ */
  const canvas = document.getElementById('scene');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = matchMedia('(max-width: 820px), (pointer: coarse)').matches;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.75 : 2));
  renderer.setSize(innerWidth, innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 0, 3.5);

  const globeGroup = new THREE.Group();      // rotates: earth + arcs
  const starGroup  = new THREE.Group();      // parallax
  scene.add(globeGroup, starGroup);

  const R = 1.0;
  const DEG = Math.PI / 180;
  const clock = new THREE.Clock();

  const latLonToVec3 = (lat, lon, r = R) => {
    const phi = (90 - lat) * DEG;
    const theta = lon * DEG;
    return new THREE.Vector3(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
  };

  /* ════════════════════════════════════════════════════════════════
     1 · Land mask → continents (compact per-row segments, 60×30)
        Each pair is an inclusive [startCol, endCol] band of land.
  ════════════════════════════════════════════════════════════════ */
  const COLS = 60, ROWS = 30;
  const LAND = {
    1:[[22,24]],
    2:[[10,17],[22,25],[42,52]],
    3:[[3,20],[22,25],[30,34],[36,56]],
    4:[[3,21],[23,24],[29,35],[36,57]],
    5:[[4,21],[27,35],[36,58]],
    6:[[4,21],[27,37],[38,58]],
    7:[[5,21],[27,38],[39,57]],
    8:[[6,20],[26,44],[46,57]],
    9:[[8,19],[26,44],[45,55],[56,57]],
    10:[[10,18],[26,45],[46,56]],
    11:[[12,18],[26,44],[46,57]],
    12:[[14,19],[25,44],[52,58]],
    13:[[16,24],[25,45],[53,58]],
    14:[[17,25],[26,45],[51,58]],
    15:[[16,26],[27,44],[50,58]],
    16:[[17,27],[28,43],[52,57]],
    17:[[18,27],[29,42]],
    18:[[18,26],[30,41],[47,56]],
    19:[[18,25],[31,39],[46,57]],
    20:[[19,24],[32,37],[48,56]],
    21:[[19,23],[49,54]],
    22:[[19,22]],
    23:[[20,22]],
    24:[[20,21]]
  };

  // Count land cells so we can hit ~target particle count.
  let landCells = 0;
  for (const r in LAND) for (const [s, e] of LAND[r]) landCells += (e - s + 1);

  const TARGET = isMobile ? 12000 : 20000;
  const perCell = Math.max(6, Math.round(TARGET / landCells));
  const COUNT = landCells * perCell;

  const positions = new Float32Array(COUNT * 3);   // target (on globe)
  const starts    = new Float32Array(COUNT * 3);   // fly-in origin
  const colors    = new Float32Array(COUNT * 3);
  const delays    = new Float32Array(COUNT);
  const scales    = new Float32Array(COUNT);

  const cGold = new THREE.Color('#ffcf6b');
  const cTeal = new THREE.Color('#37e0c6');
  const tmpC  = new THREE.Color();

  let p = 0;
  for (const r in LAND) {
    const row = +r;
    for (const [s, e] of LAND[row]) {
      for (let col = s; col <= e; col++) {
        for (let k = 0; k < perCell; k++) {
          const lon = -180 + (col + Math.random()) * (360 / COLS);
          const lat =   90 - (row + Math.random()) * (180 / ROWS);
          const v = latLonToVec3(lat, lon, R);
          const i3 = p * 3;
          positions[i3] = v.x; positions[i3 + 1] = v.y; positions[i3 + 2] = v.z;

          // fly-in origin: scattered on a big random shell
          const rr = 4.5 + Math.random() * 5;
          const su = Math.random() * 2 - 1;
          const sa = Math.random() * Math.PI * 2;
          const sr = Math.sqrt(1 - su * su);
          starts[i3]     = Math.cos(sa) * sr * rr;
          starts[i3 + 1] = su * rr;
          starts[i3 + 2] = Math.sin(sa) * sr * rr;

          // jewelled palette: mostly teal oceanic glow, gold highlights
          const t = Math.random();
          tmpC.copy(t < 0.42 ? cGold : cTeal).multiplyScalar(0.75 + Math.random() * 0.45);
          colors[i3] = tmpC.r; colors[i3 + 1] = tmpC.g; colors[i3 + 2] = tmpC.b;

          delays[p] = Math.random();
          scales[p] = 0.6 + Math.random() * 0.9;
          p++;
        }
      }
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aStart',   new THREE.BufferAttribute(starts, 3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aDelay',   new THREE.BufferAttribute(delays, 1));
  geo.setAttribute('aScale',   new THREE.BufferAttribute(scales, 1));

  const globeMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime:         { value: 0 },
      uAssemble:     { value: 0 },
      uSize:         { value: isMobile ? 0.052 : 0.05 },
      uPixelRatio:   { value: renderer.getPixelRatio() },
      uMouse:        { value: new THREE.Vector3(999, 999, 999) },
      uMouseActive:  { value: 0 },
      uMouseRadius:  { value: 0.34 },
      uMouseStrength:{ value: 0.14 }
    },
    vertexShader: /* glsl */`
      uniform float uTime, uAssemble, uSize, uPixelRatio;
      uniform vec3  uMouse;
      uniform float uMouseActive, uMouseRadius, uMouseStrength;
      attribute vec3 aStart, aColor;
      attribute float aDelay, aScale;
      varying vec3 vColor;
      varying float vGlow;
      float easeOut(float t){ return 1.0 - pow(1.0 - t, 3.0); }
      void main(){
        float pr = clamp((uAssemble - aDelay * 0.45) / 0.55, 0.0, 1.0);
        pr = easeOut(pr);
        vec3 pos = mix(aStart, position, pr);

        // gentle living shimmer once assembled
        pos += normalize(position) * sin(uTime * 0.7 + aDelay * 40.0) * 0.012 * pr;

        vec4 world = modelMatrix * vec4(pos, 1.0);
        float infl = 0.0;
        if(uMouseActive > 0.5){
          float d = distance(world.xyz, uMouse);
          infl = smoothstep(uMouseRadius, 0.0, d) * uMouseActive;
          world.xyz += normalize(uMouse - world.xyz) * infl * uMouseStrength;
        }

        vec4 mv = viewMatrix * world;
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize * aScale * (1.0 + infl * 2.4) * uPixelRatio * (300.0 / -mv.z);
        vColor = aColor;
        vGlow  = (0.55 + infl * 1.8) * (0.35 + 0.65 * pr);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vGlow;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.0, d);
        a = pow(a, 1.5);
        gl_FragColor = vec4(vColor * vGlow, a);
      }
    `
  });

  const earth = new THREE.Points(geo, globeMat);
  globeGroup.add(earth);

  // Opaque occluder so far-side points are hidden → reads as a solid planet.
  const occluder = new THREE.Mesh(
    new THREE.SphereGeometry(R * 0.975, 48, 48),
    new THREE.MeshBasicMaterial({ color: '#071228' })
  );
  globeGroup.add(occluder);

  // Invisible but raycastable sphere for the magnetic cursor.
  const magnetSphere = new THREE.Mesh(
    new THREE.SphereGeometry(R * 1.02, 24, 24),
    new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, transparent: true, opacity: 0 })
  );
  globeGroup.add(magnetSphere);

  /* ════════════════════════════════════════════════════════════════
     2 · City arcs with travelling light pulses
  ════════════════════════════════════════════════════════════════ */
  const CITIES = {
    NYC:[40.7,-74.0], LON:[51.5,-0.1], TOK:[35.7,139.7], SYD:[-33.9,151.2],
    DXB:[25.2,55.3],  SIN:[1.35,103.8], SAO:[-23.5,-46.6], LAX:[34.0,-118.2],
    CAI:[30.0,31.2],  MOW:[55.75,37.6], BOM:[19.0,72.8], CPT:[-33.9,18.4]
  };
  const ROUTES = [
    ['NYC','LON'], ['LON','MOW'], ['MOW','TOK'], ['TOK','SYD'],
    ['SIN','DXB'], ['DXB','CAI'], ['CAI','CPT'], ['NYC','LAX'],
    ['LAX','TOK'], ['SAO','NYC'], ['BOM','SIN'], ['LON','CAI']
  ];

  const arcs = [];
  const arcColors = [new THREE.Color('#ffcf6b'), new THREE.Color('#37e0c6'), new THREE.Color('#7fd8ff')];

  ROUTES.forEach((route, idx) => {
    const a = latLonToVec3(...CITIES[route[0]], R * 1.005);
    const b = latLonToVec3(...CITIES[route[1]], R * 1.005);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    const lift = 1 + a.distanceTo(b) * 0.42;      // longer hops arch higher
    mid.normalize().multiplyScalar(R * lift);
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const col = arcColors[idx % arcColors.length];

    // faint full arc
    const linePts = curve.getPoints(64);
    const lineGeo = new THREE.BufferGeometry().setFromPoints(linePts);
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
      color: col, transparent: true, opacity: 0.16,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    globeGroup.add(line);

    // travelling pulse (head + fading trail)
    const N = 20;
    const pPos = new Float32Array(N * 3);
    const pT   = new Float32Array(N);
    for (let i = 0; i < N; i++) pT[i] = i / (N - 1);
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('aT', new THREE.BufferAttribute(pT, 1));
    const pMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: {
        uColor: { value: col },
        uPixelRatio: { value: renderer.getPixelRatio() }
      },
      vertexShader: /* glsl */`
        uniform float uPixelRatio;
        attribute float aT;
        varying float vA;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          vA = pow(1.0 - aT, 2.0);
          gl_PointSize = mix(0.085, 0.014, aT) * uPixelRatio * (300.0 / -mv.z);
        }
      `,
      fragmentShader: /* glsl */`
        uniform vec3 uColor;
        varying float vA;
        void main(){
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.0, d) * vA;
          gl_FragColor = vec4(uColor * (1.4 + vA), a);
        }
      `
    });
    const pulse = new THREE.Points(pGeo, pMat);
    pulse.frustumCulled = false;
    globeGroup.add(pulse);

    arcs.push({
      curve, geom: pGeo, N,
      head: Math.random(),
      speed: 0.06 + Math.random() * 0.06,
      step: 0.011
    });
  });

  function updateArcs(dt) {
    const FAR = 9999;
    for (const arc of arcs) {
      arc.head += arc.speed * dt;
      if (arc.head > 1.0) arc.head -= 1.0 + arc.step * arc.N; // brief gap between pulses
      const pos = arc.geom.attributes.position.array;
      for (let i = 0; i < arc.N; i++) {
        const t = arc.head - i * arc.step;
        const i3 = i * 3;
        if (t < 0 || t > 1) { pos[i3] = FAR; pos[i3 + 1] = FAR; pos[i3 + 2] = FAR; continue; }
        const v = arc.curve.getPointAt(t);
        pos[i3] = v.x; pos[i3 + 1] = v.y; pos[i3 + 2] = v.z;
      }
      arc.geom.attributes.position.needsUpdate = true;
    }
  }

  /* ════════════════════════════════════════════════════════════════
     3 · Starfield with parallax
  ════════════════════════════════════════════════════════════════ */
  const STAR_COUNT = isMobile ? 900 : 1600;
  const sPos = new Float32Array(STAR_COUNT * 3);
  const sSize = new Float32Array(STAR_COUNT);
  const sPhase = new Float32Array(STAR_COUNT);
  for (let i = 0; i < STAR_COUNT; i++) {
    const rr = 8 + Math.random() * 12;
    const u = Math.random() * 2 - 1;
    const a = Math.random() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    sPos[i * 3] = Math.cos(a) * s * rr;
    sPos[i * 3 + 1] = u * rr;
    sPos[i * 3 + 2] = Math.sin(a) * s * rr;
    sSize[i] = 1 + Math.random() * 2.4;
    sPhase[i] = Math.random() * Math.PI * 2;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
  starGeo.setAttribute('aPhase', new THREE.BufferAttribute(sPhase, 1));
  const starMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: /* glsl */`
      uniform float uTime, uPixelRatio;
      attribute float aSize, aPhase;
      varying float vTw;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        vTw = 0.55 + 0.45 * sin(uTime * 1.6 + aPhase);
        gl_PointSize = aSize * uPixelRatio * vTw;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vTw;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.0, d) * vTw;
        gl_FragColor = vec4(vec3(0.75, 0.85, 1.0), a);
      }
    `
  });
  starGroup.add(new THREE.Points(starGeo, starMat));

  /* ════════════════════════════════════════════════════════════════
     4 · Interaction — drag rotate, scroll zoom, magnetic cursor, parallax
  ════════════════════════════════════════════════════════════════ */
  const rot = { x: 0.15, y: 0 };          // current globe rotation
  const target = { x: 0.15, y: 0 };       // eased target
  let dragging = false, lastX = 0, lastY = 0;
  let dragVX = 0, dragVY = 0;
  const parallax = { x: 0, y: 0 };
  let camZ = 3.5;

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let mouseActiveTarget = 0;

  function pointerToNDC(e) {
    ndc.x = (e.clientX / innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  }

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup', (e) => {
    dragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', (e) => {
    pointerToNDC(e);
    parallax.x = ndc.x; parallax.y = ndc.y;

    if (dragging) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      dragVY = dx * 0.005;
      dragVX = dy * 0.005;
      target.y += dragVY;
      target.x = THREE.MathUtils.clamp(target.x + dragVX, -0.85, 0.85);
    }

    // magnetic cursor → world point on the globe
    raycaster.setFromCamera(ndc, camera);
    const hit = raycaster.intersectObject(magnetSphere, false);
    if (hit.length) {
      globeMat.uniforms.uMouse.value.copy(hit[0].point);
      mouseActiveTarget = 1;
    } else {
      mouseActiveTarget = 0;
    }
  });
  canvas.addEventListener('pointerleave', () => { mouseActiveTarget = 0; });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camZ = THREE.MathUtils.clamp(camZ + e.deltaY * 0.0016, 2.7, 4.8);
  }, { passive: false });

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.75 : 2));
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    const pr = renderer.getPixelRatio();
    globeMat.uniforms.uPixelRatio.value = pr;
    starMat.uniforms.uPixelRatio.value = pr;
    arcs.forEach(a => { a.geom = a.geom; });
  });

  /* ════════════════════════════════════════════════════════════════
     5 · Headline — staggered letters
  ════════════════════════════════════════════════════════════════ */
  (function buildHeadline() {
    const el = document.getElementById('headline');
    const words = [['Connect', false], ['the', false], ['World', true]];
    let idx = 0;
    words.forEach(([w, accent], wi) => {
      const wordEl = document.createElement('span');
      wordEl.className = 'word';
      [...w].forEach((ch) => {
        const s = document.createElement('span');
        s.className = 'letter' + (accent ? ' accent' : '');
        s.textContent = ch;
        s.style.animationDelay = (0.6 + idx * 0.055) + 's';
        wordEl.appendChild(s);
        idx++;
      });
      el.appendChild(wordEl);
      if (wi < words.length - 1) el.appendChild(document.createTextNode(' '));
    });
  })();

  /* ════════════════════════════════════════════════════════════════
     6 · Render loop
  ════════════════════════════════════════════════════════════════ */
  const ASSEMBLE_DUR = 2.8;
  let started = performance.now();

  // Loader fades out once the world is essentially assembled.
  setTimeout(() => document.getElementById('loader').classList.add('hidden'), 900);

  if (reduced) { globeMat.uniforms.uAssemble.value = 1; }

  function tick() {
    const t = clock.getElapsedTime();
    const dt = Math.min(clock.getDelta ? 0.016 : 0.016, 0.05);
    const elapsed = (performance.now() - started) / 1000;

    // loading assembly
    if (!reduced) {
      globeMat.uniforms.uAssemble.value = Math.min(elapsed / ASSEMBLE_DUR, 1);
    }
    globeMat.uniforms.uTime.value = t;
    starMat.uniforms.uTime.value = t;

    // auto-rotate (slower during assembly)
    const spin = reduced ? 0.0006 : 0.0016 * (0.3 + 0.7 * globeMat.uniforms.uAssemble.value);
    if (!dragging) target.y += spin;

    // ease rotation toward target
    rot.y += (target.y - rot.y) * 0.08;
    rot.x += (target.x - rot.x) * 0.08;
    globeGroup.rotation.y = rot.y;
    globeGroup.rotation.x = rot.x;

    // magnetic activation easing
    globeMat.uniforms.uMouseActive.value +=
      (mouseActiveTarget - globeMat.uniforms.uMouseActive.value) * 0.12;

    // parallax starfield + subtle camera drift
    starGroup.rotation.y += (parallax.x * 0.15 - starGroup.rotation.y) * 0.04;
    starGroup.rotation.x += (-parallax.y * 0.1 - starGroup.rotation.x) * 0.04;
    camera.position.x += (parallax.x * 0.18 - camera.position.x) * 0.05;
    camera.position.y += (parallax.y * 0.14 - camera.position.y) * 0.05;
    camera.position.z += (camZ - camera.position.z) * 0.08;
    camera.lookAt(0, 0, 0);

    updateArcs(0.016);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  </script>
</body>
</html>
